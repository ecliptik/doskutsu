<svg xmlns="http://www.w3.org/2000/svg" width="760" height="496" viewBox="0 0 760 496" font-family="Helvetica,Arial,sans-serif" role="img">
<title>Report two columns, not one</title>
<rect width="760" height="496" fill="#fcfcfb"/>
<text x="28" y="34" font-size="17" font-weight="600" fill="#0b0b0b">Report two columns, not one</text>
<text x="28" y="56" font-size="12.5" fill="#52514e">POD-83 + PicoGUS + ViRGE. Loop speed and wall-clock overhead are independent; one fps number hides that.</text>
<line x1="80" y1="310.0" x2="700" y2="310.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="70" y="314.0" font-size="11" fill="#8a8983" text-anchor="end">20s</text>
<line x1="80" y1="240.0" x2="700" y2="240.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="70" y="244.0" font-size="11" fill="#8a8983" text-anchor="end">30s</text>
<line x1="80" y1="170.0" x2="700" y2="170.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="70" y="174.0" font-size="11" fill="#8a8983" text-anchor="end">40s</text>
<line x1="80" y1="100.0" x2="700" y2="100.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="70" y="104.0" font-size="11" fill="#8a8983" text-anchor="end">50s</text>
<line x1="209.2" y1="100" x2="209.2" y2="352" stroke="#e6e5e1" stroke-width="1"/>
<text x="209.2" y="376" font-size="11.5" fill="#52514e" text-anchor="middle">29</text>
<line x1="338.3" y1="100" x2="338.3" y2="352" stroke="#e6e5e1" stroke-width="1"/>
<text x="338.3" y="376" font-size="11.5" fill="#52514e" text-anchor="middle">30</text>
<line x1="467.5" y1="100" x2="467.5" y2="352" stroke="#e6e5e1" stroke-width="1"/>
<text x="467.5" y="376" font-size="11.5" fill="#52514e" text-anchor="middle">31</text>
<line x1="596.7" y1="100" x2="596.7" y2="352" stroke="#e6e5e1" stroke-width="1"/>
<text x="596.7" y="376" font-size="11.5" fill="#52514e" text-anchor="middle">32</text>
<text x="390" y="398" font-size="11.5" fill="#52514e" text-anchor="middle">per-loop fps  (faster loop to the right)</text>
<text x="28" y="86" font-size="11.5" fill="#52514e">overhead_s  (less wall-clock stall lower)</text>
<circle cx="615.7" cy="135.0" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="615.7" y="115.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">GUS 20 voices</text>
<text x="615.7" y="130.0" font-size="11" fill="#52514e" text-anchor="middle">32.1 fps / 45s</text>
<circle cx="591.6" cy="317.0" r="6" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
<text x="591.6" y="343.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">AdLib</text>
<text x="591.6" y="358.0" font-size="11" fill="#52514e" text-anchor="middle">32.0 fps / 19s</text>
<circle cx="516.9" cy="296.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="510.9" y="276.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">OPL3</text>
<text x="510.9" y="291.0" font-size="11" fill="#52514e" text-anchor="middle">31.4 fps / 22s</text>
<circle cx="356.1" cy="282.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="356.1" y="308.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">WaveBlaster</text>
<text x="356.1" y="323.0" font-size="11" fill="#52514e" text-anchor="middle">30.1 fps / 24s</text>
<circle cx="143.3" cy="261.0" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="143.3" y="241.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">Organya</text>
<text x="143.3" y="256.0" font-size="11" fill="#52514e" text-anchor="middle">28.5 fps / 27s</text>
<text x="28" y="452" font-size="11.5" fill="#52514e">GUS has the fastest loop in the table and the worst wall-clock: ~25 s of GF1 instrument uploads at song changes.</text>
<text x="28" y="472" font-size="11.5" fill="#52514e">AdLib sits alone in the lower right. Organya is the only backend paying a genuine per-loop penalty.</text>
</svg>
