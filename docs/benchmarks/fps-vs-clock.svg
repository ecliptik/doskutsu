<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486" font-family="Helvetica,Arial,sans-serif" role="img">
<title>A faster CPU stops buying frame rate</title>
<rect width="760" height="486" fill="#fcfcfb"/>
<text x="28" y="34" font-size="17" font-weight="600" fill="#0b0b0b">A faster CPU stops buying frame rate</text>
<text x="28" y="56" font-size="12.5" fill="#52514e">OPL3 anchor cell, PicoGUS + S3 ViRGE, identical 102 s reel. Per-loop fps = flips / 102.</text>
<line x1="72" y1="352.0" x2="700" y2="352.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="62" y="356.0" font-size="11" fill="#8a8983" text-anchor="end">0</text>
<line x1="72" y1="301.6" x2="700" y2="301.6" stroke="#e6e5e1" stroke-width="1"/>
<text x="62" y="305.6" font-size="11" fill="#8a8983" text-anchor="end">10</text>
<line x1="72" y1="251.2" x2="700" y2="251.2" stroke="#e6e5e1" stroke-width="1"/>
<text x="62" y="255.2" font-size="11" fill="#8a8983" text-anchor="end">20</text>
<line x1="72" y1="200.8" x2="700" y2="200.8" stroke="#e6e5e1" stroke-width="1"/>
<text x="62" y="204.8" font-size="11" fill="#8a8983" text-anchor="end">30</text>
<line x1="72" y1="150.4" x2="700" y2="150.4" stroke="#e6e5e1" stroke-width="1"/>
<text x="62" y="154.4" font-size="11" fill="#8a8983" text-anchor="end">40</text>
<line x1="72" y1="100.0" x2="700" y2="100.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="62" y="104.0" font-size="11" fill="#8a8983" text-anchor="end">50</text>
<text x="131.8" y="376" font-size="11.5" fill="#52514e" text-anchor="middle">50</text>
<text x="231.5" y="376" font-size="11.5" fill="#52514e" text-anchor="middle">66</text>
<text x="331.2" y="376" font-size="11.5" fill="#52514e" text-anchor="middle">83</text>
<text x="630.2" y="376" font-size="11.5" fill="#52514e" text-anchor="middle">133</text>
<text x="386" y="398" font-size="11.5" fill="#52514e" text-anchor="middle">CPU clock (MHz)</text>
<text x="28" y="86" font-size="11.5" fill="#52514e">per-loop fps</text>
<line x1="131.8" y1="264.3" x2="670.1" y2="106.6" stroke="#b9b8b2" stroke-width="2" stroke-dasharray="5 4"/>
<text x="436.8" y="159.9" font-size="11" fill="#8a8983" text-anchor="middle">if fps scaled with clock</text>
<path d="M131.8,264.3 L231.5,235.0 L630.2,194.1" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="131.8" cy="264.3" r="5.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="131.8" y="250.3" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">17.4</text>
<text x="131.8" y="289.3" font-size="11" fill="#52514e" text-anchor="middle">486DX2-50</text>
<circle cx="231.5" cy="235.0" r="5.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="231.5" y="221.0" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">23.2</text>
<text x="231.5" y="260.0" font-size="11" fill="#52514e" text-anchor="middle">486DX2-66</text>
<circle cx="630.2" cy="194.1" r="5.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="630.2" y="180.1" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">31.3</text>
<text x="630.2" y="219.1" font-size="11" fill="#52514e" text-anchor="middle">Am5x86-133</text>
<circle cx="331.2" cy="193.8" r="5.5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="331.2" y="179.8" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">31.4</text>
<text x="331.2" y="218.8" font-size="11" fill="#52514e" text-anchor="middle">POD-83</text>
<line x1="359.1" y1="194.1" x2="604.3" y2="194.1" stroke="#8a8983" stroke-width="1" stroke-dasharray="3 3"/>
<text x="478.7" y="184.1" font-size="11.5" fill="#52514e" text-anchor="middle">60% more clock, same frame rate</text>
<text x="28" y="442" font-size="11.5" fill="#52514e">Blue: 486-family cores on one line. Orange: Pentium OverDrive, a different architecture, plotted separately.</text>
<text x="28" y="462" font-size="11.5" fill="#52514e">Within the 486 family, doubling the clock from 66 to 133 MHz returns 1.35x, not 2x.</text>
</svg>
