<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="Helvetica,Arial,sans-serif" role="img">
<title>Overhead does not scale the way loop speed does</title>
<rect width="760" height="470" fill="#fcfcfb"/>
<text x="28" y="34" font-size="17" font-weight="600" fill="#0b0b0b">Overhead does not scale the way loop speed does</text>
<text x="28" y="56" font-size="12.5" fill="#52514e">Wall-clock seconds per cell spent NOT looping: stage loads, instrument uploads, audio-ring servicing.</text>
<line x1="76" y1="344.0" x2="712" y2="344.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="66" y="348.0" font-size="11" fill="#8a8983" text-anchor="end">0s</text>
