<rect x="653.3" y="132.8" width="39.7" height="211.2" rx="4" fill="#eb6834"/>
<text x="673.2" y="125.8" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">66</text>
<text x="632.5" y="368" font-size="12" fill="#0b0b0b" text-anchor="middle">486DX2-50</text>
<line x1="76" y1="344" x2="712" y2="344" stroke="#8a8983" stroke-width="1"/>
<text x="28" y="426" font-size="11.5" fill="#52514e">AdLib omits SDL audio init entirely, so it holds no DMA ring: its overhead barely moves across a 2.7x clock range.</text>
<text x="28" y="446" font-size="11.5" fill="#52514e">GUS overhead is GF1 instrument-upload time, bus-bound rather than CPU-bound. OPL3 holds a live SB ring and nearly triples.</text>
</svg>
