<text x="66" y="316.0" font-size="11" fill="#8a8983" text-anchor="end">10s</text>
<line x1="76" y1="280.0" x2="712" y2="280.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="66" y="284.0" font-size="11" fill="#8a8983" text-anchor="end">20s</text>
<line x1="76" y1="248.0" x2="712" y2="248.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="66" y="252.0" font-size="11" fill="#8a8983" text-anchor="end">30s</text>
