<text x="472.5" y="199.4" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">43</text>
<rect x="494.3" y="174.4" width="39.7" height="169.6" rx="4" fill="#eb6834"/>
<text x="514.2" y="167.4" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">53</text>
<text x="473.5" y="368" font-size="12" fill="#0b0b0b" text-anchor="middle">486DX2-66</text>
<rect x="570.0" y="241.6" width="39.7" height="102.4" rx="4" fill="#1baf7a"/>
<text x="589.8" y="234.6" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">32</text>
