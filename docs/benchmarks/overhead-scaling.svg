<text x="66" y="220.0" font-size="11" fill="#8a8983" text-anchor="end">40s</text>
<line x1="76" y1="184.0" x2="712" y2="184.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="66" y="188.0" font-size="11" fill="#8a8983" text-anchor="end">50s</text>
<line x1="76" y1="152.0" x2="712" y2="152.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="66" y="156.0" font-size="11" fill="#8a8983" text-anchor="end">60s</text>
<line x1="76" y1="120.0" x2="712" y2="120.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="66" y="124.0" font-size="11" fill="#8a8983" text-anchor="end">70s</text>
<rect x="76" y="82" width="11" height="11" rx="2.5" fill="#1baf7a"/>
<text x="93" y="92" font-size="11.5" fill="#52514e">AdLib</text>
<rect x="153.0" y="82" width="11" height="11" rx="2.5" fill="#2a78d6"/>
<text x="170.0" y="92" font-size="11.5" fill="#52514e">OPL3</text>
<rect x="223.0" y="82" width="11" height="11" rx="2.5" fill="#eb6834"/>
<text x="240.0" y="92" font-size="11.5" fill="#52514e">GUS 20 voices</text>
<rect x="93.0" y="283.2" width="39.7" height="60.8" rx="4" fill="#1baf7a"/>
<text x="112.8" y="276.2" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">19</text>
<rect x="134.7" y="273.6" width="39.7" height="70.4" rx="4" fill="#2a78d6"/>
<text x="154.5" y="266.6" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">22</text>
<rect x="176.3" y="200.0" width="39.7" height="144.0" rx="4" fill="#eb6834"/>
<text x="196.2" y="193.0" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">45</text>
<text x="155.5" y="368" font-size="12" fill="#0b0b0b" text-anchor="middle">POD-83</text>
<rect x="252.0" y="283.2" width="39.7" height="60.8" rx="4" fill="#1baf7a"/>
<text x="271.8" y="276.2" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">19</text>
<rect x="293.7" y="257.6" width="39.7" height="86.4" rx="4" fill="#2a78d6"/>
<text x="313.5" y="250.6" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">27</text>
<rect x="335.3" y="200.0" width="39.7" height="144.0" rx="4" fill="#eb6834"/>
<text x="355.2" y="193.0" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">45</text>
<text x="314.5" y="368" font-size="12" fill="#0b0b0b" text-anchor="middle">Am5x86-133</text>
