<svg xmlns="http://www.w3.org/2000/svg" width="760" height="428" viewBox="0 0 760 428" font-family="Helvetica,Arial,sans-serif" role="img">
<title>AdLib leads every CPU, by how much</title>
<rect width="760" height="428" fill="#fcfcfb"/>
<text x="28" y="34" font-size="17" font-weight="600" fill="#0b0b0b">AdLib leads every CPU -- by how much</text>
<text x="28" y="56" font-size="12.5" fill="#52514e">Round M per-loop fps, PicoGUS + S3 ViRGE held fixed so only the CPU varies. Color follows the palette used</text>
<text x="28" y="71" font-size="12.5" fill="#52514e">throughout this page: green fastest/cheapest, blue default-tier, orange costs the most.</text>

<!-- column headers -->
<text x="257" y="88" font-size="12" fill="#52514e" text-anchor="middle">AdLib</text>
<text x="439" y="88" font-size="12" fill="#52514e" text-anchor="middle">OPL3 FM</text>
<text x="621" y="88" font-size="12" fill="#52514e" text-anchor="middle">Organya</text>

<!-- row labels -->
<text x="160" y="119" font-size="13" fill="#0b0b0b" text-anchor="end">Pentium OverDrive 83</text>
<text x="160" y="177" font-size="13" fill="#0b0b0b" text-anchor="end">Am5x86-133</text>
<text x="160" y="235" font-size="13" fill="#0b0b0b" text-anchor="end">486DX2-66</text>
<text x="160" y="293" font-size="13" fill="#0b0b0b" text-anchor="end">486DX2-50</text>

<!-- row 0: POD-83 -->
<rect x="172" y="92" width="170" height="44" rx="4" fill="#1baf7a"/>
<text x="257" y="117" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">32.2 fps</text>
<text x="257" y="130" font-size="10" fill="#ffffff" text-anchor="middle">baseline</text>

<rect x="354" y="92" width="170" height="44" rx="4" fill="#2a78d6"/>
<text x="439" y="117" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">30.2 fps</text>
<text x="439" y="130" font-size="10" fill="#ffffff" text-anchor="middle">-2.0 vs AdLib</text>

<rect x="536" y="92" width="170" height="44" rx="4" fill="#eb6834"/>
<text x="621" y="117" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">27.7 fps</text>
<text x="621" y="130" font-size="10" fill="#ffffff" text-anchor="middle">-4.5 vs AdLib</text>

<!-- row 1: Am5x86-133 -->
<rect x="172" y="150" width="170" height="44" rx="4" fill="#1baf7a"/>
<text x="257" y="175" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">32.1 fps</text>
<text x="257" y="188" font-size="10" fill="#ffffff" text-anchor="middle">baseline</text>

<rect x="354" y="150" width="170" height="44" rx="4" fill="#2a78d6"/>
<text x="439" y="175" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">30.5 fps</text>
<text x="439" y="188" font-size="10" fill="#ffffff" text-anchor="middle">-1.6 vs AdLib</text>

<rect x="536" y="150" width="170" height="44" rx="4" fill="#eb6834"/>
<text x="621" y="175" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">27.6 fps</text>
<text x="621" y="188" font-size="10" fill="#ffffff" text-anchor="middle">-4.5 vs AdLib</text>

<!-- row 2: 486DX2-66 -->
<rect x="172" y="208" width="170" height="44" rx="4" fill="#1baf7a"/>
<text x="257" y="233" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">24.0 fps</text>
<text x="257" y="246" font-size="10" fill="#ffffff" text-anchor="middle">baseline</text>

<rect x="354" y="208" width="170" height="44" rx="4" fill="#2a78d6"/>
<text x="439" y="233" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">22.2 fps</text>
<text x="439" y="246" font-size="10" fill="#ffffff" text-anchor="middle">-1.8 vs AdLib</text>

<rect x="536" y="208" width="170" height="44" rx="4" fill="#eb6834"/>
<text x="621" y="233" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">19.8 fps</text>
<text x="621" y="246" font-size="10" fill="#ffffff" text-anchor="middle">-4.2 vs AdLib</text>

<!-- row 3: 486DX2-50 -->
<rect x="172" y="266" width="170" height="44" rx="4" fill="#1baf7a"/>
<text x="257" y="291" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">17.8 fps</text>
<text x="257" y="304" font-size="10" fill="#ffffff" text-anchor="middle">baseline</text>

<rect x="354" y="266" width="170" height="44" rx="4" fill="#2a78d6"/>
<text x="439" y="291" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">17.1 fps</text>
<text x="439" y="304" font-size="10" fill="#ffffff" text-anchor="middle">-0.7 vs AdLib</text>

<rect x="536" y="266" width="170" height="44" rx="4" fill="#eb6834"/>
<text x="621" y="291" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">14.6 fps</text>
<text x="621" y="304" font-size="10" fill="#ffffff" text-anchor="middle">-3.2 vs AdLib</text>

<!-- legend -->
<rect x="172" y="336" width="16" height="16" rx="3" fill="#1baf7a"/>
<text x="194" y="348" font-size="12" fill="#0b0b0b">AdLib -- fastest on every CPU (baseline for the deltas above)</text>

<rect x="172" y="360" width="16" height="16" rx="3" fill="#2a78d6"/>
<text x="194" y="372" font-size="12" fill="#0b0b0b">OPL3 FM -- default backend</text>

<rect x="172" y="384" width="16" height="16" rx="3" fill="#eb6834"/>
<text x="194" y="396" font-size="12" fill="#0b0b0b">Organya -- software synth, pays a real per-loop cost</text>

<text x="28" y="416" font-size="11" fill="#8a8983">Round M, 2026-08-17. Noise floor is 0.2 fps -- see below.</text>
</svg>
