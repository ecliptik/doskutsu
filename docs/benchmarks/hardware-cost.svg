<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="Helvetica,Arial,sans-serif" role="img">
<title>What the cards cost, on every CPU</title>
<rect width="760" height="440" fill="#fcfcfb"/>
<text x="28" y="34" font-size="17" font-weight="600" fill="#0b0b0b">What the cards cost, on every CPU</text>
<text x="28" y="56" font-size="12.5" fill="#52514e">Per-loop fps given up by the slower part, same CPU and same reel. Positive means the first card is faster.</text>
