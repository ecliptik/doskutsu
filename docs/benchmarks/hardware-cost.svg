<line x1="76" y1="326" x2="712" y2="326" stroke="#8a8983" stroke-width="1"/>
<text x="28" y="106" font-size="11.5" fill="#52514e">per-loop fps advantage</text>
<text x="28" y="396" font-size="11.5" fill="#52514e">The video gap shrinks on slower CPUs: the Cirrus penalty is a memory-side cost, which hides behind CPU time when the loop is CPU-bound.</text>
<text x="28" y="416" font-size="11.5" fill="#52514e">The sound-card gap holds near 1 fps everywhere. Both are larger than the 0.22 fps run-to-run noise floor.</text>
