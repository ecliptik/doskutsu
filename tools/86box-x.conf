# 86box-x.conf -- g2k parity profile for 86Box, second-emulator smoke target
#
# Companion to tools/dosbox-x.conf. Used by tools/86box-run.sh + the
# `make hwinv-86box-smoke` target. Approximates the same g2k machine
# DOSBox-X parity targets (Gateway 2000 P5-90 era / Cirrus CL-GD5434 /
# SB16 PnP / 48 MB RAM) at 86Box's level of chip accuracy.
#
# Per docs/internal/WAVE-41-DOSBOX-PROFILING-PLAN.md sec. 5.1: 86Box
# CL-GD5434 emulation is "shape-correct, accuracy-unverified" specifically
# at the 5434 level (5426/5428/5430 are in tree; 5434 inherits but
# detailed timing fidelity isn't published). For HWINV.EXE the key
# discriminator is the section SHAPES + the DOSBOX_DETECTED marker
# absence, not chip-cycle accuracy.
#
# 86Box config files are INI-style. 86Box may REWRITE this file on first
# run, normalizing keys and adding auto-detected ones (host_cpu, uuid,
# vid_renderer, cpu_multi, etc.). Treat this file as a SEED; per-VM
# canonical state lives in <vmpath>/86box.cfg which tools/86box-run.sh
# stages from this seed on each run.
#
# BOOT SHAPE: hard disk via the operator's actual g2k CF image
# (~/g2k-cf.img). The image has MS-DOS 6.22 + CWSDPMI + UniVBE 6.70
# already installed plus the operator's [menu] CONFIG.SYS, exactly
# byte-for-byte what runs on g2k itself. Tri-environment correlation
# (Tier-1 DOSBox-X / Tier-2 86Box / Tier-3 g2k) is therefore as tight
# as the operator's actual boot state.
#
# The image has been modified by build-qa task #11 to add an HWINV
# menu entry that runs HWINV.EXE from C:\DOSKUTSU\ -- see
# `docs/internal/G2K-CF-IMAGE-CHANGES.md` for the canonical record of
# every modification. The HWINV menu is the 9th choice; operator's
# default (UNIVBE) is unchanged. tools/86box-run.sh selects HWINV via
# xdotool keypress `H` + Return at the menu screen.
#
# What IS pinned in this config:
#   - Globalyst 330/P5 (Gateway 2000 P5-90 ROM) -- literally g2k-vintage
#     hardware; closest 86Box machine entry to the real reference box
#   - Pentium P54C class (cpu_family=pentium_p54c)
#   - 48 MB RAM (matches g2k exactly; mem_size=49152 KB)
#   - Cirrus CL-GD5434 on PCI bus (gfxcard=cl_gd5434_pci; matches g2k)
#   - SB16 PnP (matches g2k VIBRA boot) with OPL3 (ymf262)
#   - IDE controller with the operator's CF image as primary master
#   - dynarec enabled (cpu_use_dynarec=1) -- fast-mode for CI; rebuild
#     with dynarec=0 for cycle-faithful tests
#   - do_auto_pause=0 -- redundant under real X display but harmless
#
# What is NOT pinned (left at 86Box defaults / 86Box-auto-fills):
#   - host_cpu, uuid, emu_build_num, vid_renderer (86Box auto-fills)
#   - ISA bus timing model (not tunable via cfg)
#   - DreamBlaster S2 daughterboard (86Box does NOT emulate WaveBlaster
#     wavetable response; open feature request at
#     https://github.com/86Box/86Box/issues/1597). HWINV's WB section
#     pattern S1 probes DSP-cmd-0x34 ACK only; that path exercises
#     86Box's SB16 DSP, which IS emulated.
#   - PicoGUS (operator's :VIBRA path loads PGUSINIT.EXE which 86Box
#     cannot emulate). HWINV boot path bypasses this by selecting the
#     HWINV menu choice which has no driver loads.
#
# Bootstrap (operator-side, one-time):
#   1. Download 86Box AppImage from https://github.com/86Box/86Box/releases
#      (~85 MB; v5.3 verified working as of 2026-05-13).
#        mkdir -p ~/emulators/86box
#        curl -L -o ~/emulators/86box/86Box.AppImage \
#          "https://github.com/86Box/86Box/releases/download/v5.3/86Box-Linux-x86_64-b8200.AppImage"
#        chmod +x ~/emulators/86box/86Box.AppImage
#      Optional one-time extract for faster repeated launches:
#        cd ~/emulators/86box && ./86Box.AppImage --appimage-extract
#      Override location via env: BOX86_APPIMAGE=/path/to/86Box.AppImage.
#   2. Clone 86Box ROMs (~180 MB; one-time):
#        git clone --depth=1 https://github.com/86Box/roms ~/emulators/86box/roms
#      Override via env: BOX86_ROMPATH=/path/to/roms.
#   3. Confirm the operator's CF image is at ~/g2k-cf.img (operator-
#      provided; see docs/internal/G2K-CF-IMAGE-CHANGES.md for canonical
#      tracking). Override via env: BOX86_IMG=/path/to/cf-image.img.
#   4. Install host-side mtools (for FAT image inspection) + xdotool +
#      scrot:
#        sudo apt install mtools xdotool scrot
#      Xvfb is NOT required when host has a real X display (DISPLAY=:0).

[General]
vm_name = doskutsu-g2k-parity
confirm_save = 0
confirm_exit = 0
do_auto_pause = 0
enable_discord = 0
window_remember = 0
sound_gain = 0

[Machine]
# Globalyst 330/P5 = Gateway 2000 P5-90 (g2k's contemporary).
machine = ap5s
cpu_family = pentium_p54c
cpu_speed = 90000000
fpu_type = internal
cpu_use_dynarec = 1
mem_size = 49152
time_sync = local

[Video]
gfxcard = cl_gd5434_pci
vid_vram_size_kb = 2048

[Input devices]
mouse_type = ps2
keyboard_type = keyboard_at

[Sound]
sndcard = sb16_pnp
opl_type = ymf262
sb_base = 0x220
sb_irq = 5
sb_dma = 1
sb_hdma = 5
sb_mpu_base = 0x330

[Storage controllers]
hdc = ide_pci

[Hard disks]
# Primary master = the operator's CF image. CHS derived from the image's
# MBR: 976 cyl / 64 head / 63 sectors-per-track. Total = 976*64*63 =
# 3934 K sectors = ~1.88 GiB, matching the 2017419264-byte image. The
# fn= path is RELATIVE to the vmpath; tools/86box-run.sh symlinks
# ~/g2k-cf.img into the vmpath at run time so 86Box opens the canonical
# image directly (any 86Box-side writes back into the canonical image
# -- per the user's updated permission to modify the image freely +
# the change-tracking discipline in G2K-CF-IMAGE-CHANGES.md).
hdd_01_parameters = 63, 64, 976, 0, ide
hdd_01_fn = g2k-cf.img

[Floppy and CD-ROM drives]
fdd_01_type = 35_2hd
fdd_02_type = none

[Network]
net_card = none

[Other peripherals]
isartc_type = none

# End of conf.
